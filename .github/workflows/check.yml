name: check
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: tools/check.sh
        shell: bash
        env:
          PYTHON: python
